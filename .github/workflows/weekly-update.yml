name: Weekly Data Update

# WorkBuddy pushes validated CSV snapshots to data/. This workflow owns the cloud half:
# test -> ingest Supabase -> prerender JSON -> verify freshness -> commit JSON -> Vercel deploy.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
  schedule:
    # Sunday 00:30 UTC / Beijing 08:30. Compensation for transient push or platform failures.
    - cron: "30 0 * * 0"
  workflow_dispatch: {}

concurrency:
  group: weekly-data-update-main
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            scripts/package-lock.json
            frontend/package-lock.json

      - name: Install scripts dependencies
        run: npm --prefix scripts ci --no-audit --no-fund

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Verify input data
        run: |
          COUNT=$(find data -maxdepth 1 -type f -name 'NEV_weekly_report_*.csv' | wc -l)
          echo "CSV files in data/: $COUNT"
          test "$COUNT" -gt 0 || { echo "::error::data/ has no weekly CSV files"; exit 1; }
          test -s data/brand_colors.json || { echo "::error::data/brand_colors.json is missing or empty"; exit 1; }

      - name: Test scripts
        run: npm --prefix scripts test

      - name: Test frontend
        run: npm --prefix frontend test

      - name: Typecheck frontend
        run: npm --prefix frontend run typecheck

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Ingest to Supabase
        run: npm run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEV_DATA_DIR: data

      - name: Prerender static JSON
        run: npm run prerender
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Verify snapshot freshness
        run: npm run validate:snapshot
        env:
          NEV_DATA_DIR: data
          NEV_PUBLIC_DATA_DIR: frontend/public/data

      - name: Commit and push generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data
          if git diff --cached --quiet; then
            echo "No generated snapshot changes"
            exit 0
          fi
          git commit -m "chore: update weekly data ($(date +%Y-%m-%d))"
          git fetch origin main
          if ! git diff --quiet HEAD^..origin/main -- data; then
            echo "::error::Remote data changed while this run was generating snapshots; the queued data workflow will regenerate them."
            exit 1
          fi
          git rebase origin/main
          git push origin HEAD:main
